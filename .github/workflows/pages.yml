name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
      - github-pages-migration
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build static SPA
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run build

      - name: Prepare GitHub Pages files
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          SHELL_FILE="$(find . -type f -name '_shell.html' -not -path './node_modules/*' -not -path './.git/*' -print -quit)"
          if [ -n "$SHELL_FILE" ]; then
            PUBLISH_DIR="$(dirname "$SHELL_FILE")"
            cp "$SHELL_FILE" "$PUBLISH_DIR/index.html"
            cp "$SHELL_FILE" "$PUBLISH_DIR/404.html"
          else
            INDEX_FILE="$(find . -type f -name 'index.html' -not -path './node_modules/*' -not -path './.git/*' -print -quit)"
            if [ -z "$INDEX_FILE" ]; then
              echo "No static HTML entry point was generated."
              exit 1
            fi
            PUBLISH_DIR="$(dirname "$INDEX_FILE")"
            cp "$INDEX_FILE" "$PUBLISH_DIR/404.html"
          fi
          touch "$PUBLISH_DIR/.nojekyll"
          echo "publish_dir=$PUBLISH_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.prepare.outputs.publish_dir }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
