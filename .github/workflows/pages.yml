name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
      - github-pages-migration
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build static SPA
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run build

      - name: Prepare GitHub Pages files
        run: |
          set -euo pipefail
          if [ -d ".output/public" ]; then
            PUBLISH_DIR=".output/public"
          elif [ -d "dist" ]; then
            PUBLISH_DIR="dist"
          else
            echo "Static output directory was not found."
            find . -maxdepth 3 -type d \( -name public -o -name dist \)
            exit 1
          fi

          if [ -f "$PUBLISH_DIR/_shell.html" ]; then
            cp "$PUBLISH_DIR/_shell.html" "$PUBLISH_DIR/index.html"
            cp "$PUBLISH_DIR/_shell.html" "$PUBLISH_DIR/404.html"
          elif [ -f "$PUBLISH_DIR/index.html" ]; then
            cp "$PUBLISH_DIR/index.html" "$PUBLISH_DIR/404.html"
          else
            echo "Neither the SPA shell nor index.html was generated."
            find "$PUBLISH_DIR" -maxdepth 3 -type f | head -100
            exit 1
          fi

          touch "$PUBLISH_DIR/.nojekyll"
          echo "GitHub Pages output: $PUBLISH_DIR"
          find "$PUBLISH_DIR" -maxdepth 2 -type f | head -100

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
